<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Etiquetas Web</title>
    <link rel="icon" type="image/png" href="./favicon.png?v=2">
    
    <meta name="theme-color" content="#16a34a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Etiquetas">
    <link rel="manifest" href="./manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase Compat (Mais estável para arquivos HTML diretos) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        .popup-blur { backdrop-filter: blur(4px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        .admin-only { display: none !important; }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 font-sans overflow-x-hidden">

    <!-- TELA DE LOGIN -->
    <div id="modalLogin" class="fixed inset-0 bg-gray-950 z-[9999] flex items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 w-full max-w-sm shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-green-500">Gestão de Etiquetas</h1>
            </div>
            <!-- onSubmit travado para não recarregar a página -->
            <form id="formLogin" class="space-y-4" onsubmit="event.preventDefault(); window.fazerLogin();">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Usuário</label>
                    <input type="text" id="loginUsuario" required class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white outline-none focus:border-green-500" placeholder="Digite seu usuário">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="loginSenha" required class="w-full p-3 pr-10 rounded-lg bg-gray-900 border border-gray-700 text-white outline-none focus:border-green-500" placeholder="••••••••">
                        <button type="button" onclick="window.toggleMostrarSenha()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white focus:outline-none">
                            <i id="iconeOlho" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btnEntrar" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition mt-4">Entrar</button>
                <div class="text-center pt-2">
                    <button type="button" onclick="window.redefinirSenhaFirebase()" class="text-xs text-gray-400 hover:text-green-400 transition underline">Esqueceu sua senha?</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SOBREPOSIÇÃO DO MENU -->
    <div id="menuOverlay" onclick="window.fecharMenuLateral()" class="fixed inset-0 bg-gray-950/70 popup-blur z-50 hidden opacity-0 transition-opacity duration-300"></div>

    <!-- MENU LATERAL -->
    <aside id="drawerMenuLateral" class="fixed top-0 left-0 h-full w-80 bg-gray-800 border-r border-gray-700 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col p-6">
        <div class="flex items-center justify-between border-b border-gray-700 pb-4 mb-6">
            <div class="flex items-center gap-2.5 text-green-400 font-semibold truncate">
                <i class="fas fa-user-circle text-2xl"></i>
                <span id="lblNomeUsuarioMenu" class="text-base truncate">Carregando...</span>
            </div>
            <button onclick="window.fecharMenuLateral()" class="text-gray-400 hover:text-white text-xl p-1 transition"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex flex-col gap-3 flex-1 overflow-y-auto custom-scrollbar pr-1">
            <label class="admin-only w-full text-left bg-gray-700/50 hover:bg-gray-700 text-white px-4 py-3 rounded-lg flex items-center gap-3 transition font-medium text-sm cursor-pointer">
                <i class="fas fa-file-excel text-green-400 w-5 text-center"></i> Importar Banco (.xlsx)
                <input type="file" id="inputPlanilha" accept=".xlsx" class="hidden" onchange="window.processarPlanilha(event); window.fecharMenuLateral();">
            </label>
            <button onclick="window.abrirHistorico(); window.fecharMenuLateral();" class="w-full text-left bg-gray-700/50 hover:bg-gray-700 text-white px-4 py-3 rounded-lg flex items-center gap-3 transition font-medium text-sm">
                <i class="fas fa-history text-blue-400 w-5 text-center"></i> Histórico
            </button>
            <button onclick="window.abrirModal('modalCadastroUsuario'); window.fecharMenuLateral();" class="admin-only w-full text-left bg-gray-700/50 hover:bg-gray-700 text-white px-4 py-3 rounded-lg flex items-center gap-3 transition font-medium text-sm">
                <i class="fas fa-user-plus text-purple-400 w-5 text-center"></i> Novo Usuário
            </button>
            <hr id="linhaAdmin" class="admin-only border-gray-700 my-2">
            <button onclick="window.limparBancoDeDadosCompletoAdmin(); window.fecharMenuLateral();" class="admin-only w-full text-left bg-red-950/40 hover:bg-red-900/60 text-red-200 border border-red-800/50 px-4 py-3 rounded-lg flex items-center gap-3 transition font-medium text-sm">
                <i class="fas fa-database text-red-400 w-5 text-center"></i> Limpar Banco de Dados
            </button>
        </div>
        <div class="border-t border-gray-700 pt-4 mt-auto">
            <button onclick="window.fazerLogout()" class="w-full text-left bg-gray-900 hover:bg-red-900/40 text-red-400 border border-red-900/30 px-4 py-3 rounded-lg flex items-center gap-3 transition font-semibold text-sm">
                <i class="fas fa-sign-out-alt w-5 text-center"></i> Sair do Sistema
            </button>
        </div>
    </aside>

    <!-- TELA PRINCIPAL -->
    <div id="mainDashboard" class="min-h-screen p-4 md:p-6 max-w-[1600px] mx-auto">
        <header class="relative flex justify-center items-center mb-6 border-b border-gray-800 pb-4">
            <button onclick="window.abrirMenuLateral()" class="absolute left-0 p-2 text-gray-300 hover:text-white focus:outline-none text-2xl transition"><i class="fas fa-bars"></i></button>
            <h1 class="text-2xl md:text-3xl font-bold text-green-500 tracking-wide text-center">Gestão de Etiquetas</h1>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-10 gap-6">
            <div class="md:col-span-7 flex flex-col gap-4 h-[850px]">
                <input type="text" id="inputBusca" oninput="window.filtrarProdutos()" placeholder="Buscar Item por Nome, Código de barras, Referência ou GEMCO..." class="w-full p-3.5 rounded-lg bg-gray-800 border border-gray-700 focus:border-green-500 focus:outline-none shadow-inner text-base text-white">
                <div class="flex flex-wrap gap-3 items-center flex-shrink-0">
                    <button onclick="window.abrirModalCadastroProduto()" class="bg-green-700 hover:bg-green-600 text-white px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 transition text-sm shadow-sm"><i class="fas fa-plus"></i> Cadastrar Produto</button>
                    <button onclick="window.limparSelecoesComConfirmacao()" class="bg-gray-700 hover:bg-gray-600 text-white px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 transition text-sm shadow-sm"><i class="fas fa-eraser"></i> Limpar Selecionados</button>
                </div>
                <main class="bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-lg flex-1 flex flex-col">
                    <div class="p-4 border-b border-gray-700 bg-gray-850 flex justify-between items-center text-sm text-gray-400 flex-shrink-0">
                        <span id="lblTituloCatalogo">Catálogo de Produtos</span>
                        <span id="contadorItens">Carregando itens...</span>
                    </div>
                    <ul id="listaProdutos" class="divide-y divide-gray-700 flex-1 overflow-y-auto custom-scrollbar"></ul>
                </main>
            </div>
            <div class="md:col-span-3 bg-gray-800 border border-gray-700 rounded-xl p-4 flex flex-col shadow-lg h-[850px] sticky top-4">
                <div class="border-b border-gray-700 pb-3 mb-3 flex-shrink-0">
                    <h2 class="font-bold text-white text-sm flex items-center gap-2"><i class="fas fa-tags text-green-400"></i> Itens Selecionados</h2>
                </div>
                <div id="listaSelecionadosPainel" class="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 pr-1"></div>
                <div class="border-t border-gray-700 pt-3 mt-3 flex-shrink-0">
                    <div class="text-xs text-gray-400 mb-2 text-center">Total: <span id="txtTotalSelecionadoRodape" class="font-bold text-green-400">0</span> etiquetas</div>
                    <button onclick="window.gerarPDFEtiquetas()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold px-4 py-3 rounded-lg shadow-lg flex items-center justify-center gap-2 transition text-sm"><i class="fas fa-print"></i> Gerar PDF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CADASTRO PRODUTO -->
    <div id="modalCadastroProduto" class="fixed inset-0 bg-black/70 popup-blur hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 w-full max-w-md shadow-2xl">
            <h3 id="tituloModalProduto" class="text-xl font-bold mb-4 text-white">Cadastrar Etiqueta</h3>
            <form id="formCadastroProduto" class="space-y-4" onsubmit="event.preventDefault(); window.salvarProduto();">
                <input type="hidden" id="pIdKey">
                <div><label class="block text-xs text-gray-400 mb-1">Nome</label><input type="text" id="pNome" required class="w-full p-2 rounded bg-gray-700 text-white"></div>
                <div><label class="block text-xs text-gray-400 mb-1">GEMCO</label><input type="text" id="pGemco" required class="w-full p-2 rounded bg-gray-700 text-white"></div>
                <div><label class="block text-xs text-gray-400 mb-1">Referência</label><input type="text" id="pReferencia" class="w-full p-2 rounded bg-gray-700 text-white"></div>
                <div><label class="block text-xs text-gray-400 mb-1">Barras</label><input type="text" id="pBarras" class="w-full p-2 rounded bg-gray-700 text-white"></div>
                <div class="flex justify-end gap-3"><button type="button" onclick="window.fecharModal('modalCadastroProduto')" class="px-4 py-2 border rounded text-gray-300">Cancelar</button><button type="submit" class="px-5 py-2 bg-green-600 rounded text-white">Salvar</button></div>
            </form>
        </div>
    </div>

    <!-- MODAL QUANTIDADE -->
    <div id="modalQuantidade" class="fixed inset-0 bg-black/70 popup-blur hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-bold mb-1 text-white">Definir Quantidade</h3>
            <p id="lblProdutoQtd" class="text-xs text-gray-400 tracking-wider mb-4"></p>
            <div class="mb-4"><input type="number" id="inputQtdValor" min="0" class="w-full p-3 rounded text-center bg-gray-700 text-xl font-bold text-white"></div>
            <div class="flex justify-end gap-2"><button onclick="window.fecharModal('modalQuantidade')" class="px-4 py-2 border rounded text-gray-300">Cancelar</button><button onclick="window.confirmarQuantidade()" class="px-5 py-2 bg-green-600 rounded text-white">Confirmar</button></div>
        </div>
    </div>

    <!-- MODAL USUÁRIO -->
    <div id="modalCadastroUsuario" class="fixed inset-0 bg-black/70 popup-blur hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-white">Criar Conta</h3>
            <form id="formCadastroUsuario" class="space-y-3" onsubmit="event.preventDefault(); window.salvarNovoUsuario();">
                <div><label class="block text-xs text-gray-400">E-mail</label><input type="email" id="uEmail" required class="w-full p-2 rounded bg-gray-700 text-white"></div>
                <div><label class="block text-xs text-gray-400">Usuário</label><input type="text" id="uUsername" required class="w-full p-2 rounded bg-gray-700 text-white"></div>
                <div><label class="block text-xs text-gray-400">Senha</label><input type="password" id="uSenha" required class="w-full p-2 rounded bg-gray-700 text-white"></div>
                <div><label class="block text-xs text-gray-400">Perfil</label><select id="uPerfil" class="w-full p-2 rounded bg-gray-700 text-white"><option value="executor">Executor</option><option value="administrador">Administrador</option></select></div>
                <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="window.fecharModal('modalCadastroUsuario')" class="px-4 py-2 border rounded text-gray-300">Cancelar</button><button type="submit" class="px-5 py-2 bg-purple-600 rounded text-white">Cadastrar</button></div>
            </form>
        </div>
    </div>

    <!-- MODAL HISTÓRICO -->
    <div id="modalHistorico" class="fixed inset-0 bg-black/70 popup-blur hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 w-full max-w-2xl shadow-2xl flex flex-col max-h-[85vh]">
            <h3 class="text-xl font-bold mb-4 text-white">Histórico</h3>
            <div class="overflow-y-auto flex-1 border border-gray-700 rounded-lg bg-gray-850 custom-scrollbar">
                <table class="w-full text-left border-collapse text-sm">
                    <thead><tr class="bg-gray-900 border-b border-gray-700 text-gray-400"><th class="p-3">Usuário</th><th class="p-3">Data</th><th class="p-3">Qtd</th><th class="p-3 text-right">Ações</th></tr></thead>
                    <tbody id="tabelaHistoricoCorpo" class="divide-y divide-gray-700"></tbody>
                </table>
            </div>
            <div class="flex justify-end mt-4"><button onclick="window.fecharModal('modalHistorico')" class="px-5 py-2 bg-gray-700 rounded text-white">Fechar</button></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCeqM0xnEn5Qm3z7GwxRoEEiTxdZkRW_1E",
          authDomain: "etiquetas-loja-2f590.firebaseapp.com",
          databaseURL: "https://etiquetas-loja-2f590-default-rtdb.firebaseio.com",
          projectId: "etiquetas-loja-2f590",
          storageBucket: "etiquetas-loja-2f590.firebasestorage.app",
          messagingSenderId: "699786863257",
          appId: "1:699786863257:web:1cf452f00ab9448778ce08"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let todosProdutos = [];
        let carrinhoSelecionados = {};
        let ordemSelecao = []; 
        let dadosUsuarioLogado = { username: "Administrador", perfil: "executor" };
        let produtoAlvoQuantidade = null;

        document.getElementById("inputQtdValor").addEventListener("keydown", function(e) {
            if (e.key === "Enter") window.confirmarQuantidade();
        });

        window.toggleMostrarSenha = function() {
            const inputSenha = document.getElementById('loginSenha');
            const icone = document.getElementById('iconeOlho');
            if (inputSenha.type === 'password') {
                inputSenha.type = 'text'; icone.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                inputSenha.type = 'password'; icone.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        function verificarEConfigurarAdminAutomatico() {
            db.ref('usuarios_sistema').once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    db.ref('usuarios_sistema/admin_padrao').set({
                        username: "admin", email: "admin@etiquetas.com", perfil: "administrador"
                    });
                }
            }).catch(console.log);
        }
        verificarEConfigurarAdminAutomatico();

        window.fazerLogin = function() {
            const usuarioInput = document.getElementById('loginUsuario').value.trim().toLowerCase();
            const senha = document.getElementById('loginSenha').value;
            const btn = document.getElementById('btnEntrar');
            btn.innerText = "Entrando..."; btn.disabled = true;

            db.ref('usuarios_sistema').once('value').then((snapshot) => {
                let emailEncontrado = null;
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const dados = child.val();
                        if (dados.username && dados.username.toLowerCase() === usuarioInput) emailEncontrado = dados.email;
                    });
                }
                if (!emailEncontrado) {
                    alert("Usuário não encontrado.");
                    btn.innerText = "Entrar"; btn.disabled = false;
                    return;
                }
                auth.signInWithEmailAndPassword(emailEncontrado, senha).catch(err => {
                    alert("Erro ao entrar: " + err.message);
                    btn.innerText = "Entrar"; btn.disabled = false;
                });
            }).catch(err => {
                alert("Erro no banco: " + err.message);
                btn.innerText = "Entrar"; btn.disabled = false;
            });
        };

        window.redefinirSenhaFirebase = function() {
            const usuarioInput = document.getElementById('loginUsuario').value.trim().toLowerCase();
            if (!usuarioInput) return alert("Digite seu usuário no campo acima para redefinir a senha.");
            db.ref('usuarios_sistema').once('value').then((snapshot) => {
                let emailEncontrado = null;
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        if (child.val().username.toLowerCase() === usuarioInput) emailEncontrado = child.val().email;
                    });
                }
                if (!emailEncontrado) return alert("Usuário não encontrado.");
                auth.sendPasswordResetEmail(emailEncontrado).then(() => alert("E-mail enviado! Verifique sua caixa de entrada.")).catch(err => alert("Erro: " + err.message));
            });
        };

        window.fazerLogout = function() {
            auth.signOut().then(() => window.location.reload()).catch(err => alert(err.message));
        };

        function verificarAcessoPorEmail(emailUser) {
            db.ref('usuarios_sistema').once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const dados = child.val();
                        if (dados.email.toLowerCase() === emailUser.toLowerCase()) {
                            dadosUsuarioLogado = dados;
                            document.getElementById("lblNomeUsuarioMenu").innerText = dados.username;
                            if (dados.perfil === 'administrador') document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('admin-only'));
                        }
                    });
                }
            });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('modalLogin').classList.add('hidden');
                verificarAcessoPorEmail(user.email);
                carregarBancoDadosCompleto();
            } else {
                document.getElementById('modalLogin').classList.remove('hidden');
            }
        });

        window.abrirMenuLateral = function() {
            const overlay = document.getElementById("menuOverlay"), drawer = document.getElementById("drawerMenuLateral");
            overlay.classList.remove("hidden");
            setTimeout(() => { overlay.classList.remove("opacity-0"); drawer.classList.remove("-translate-x-full"); }, 10);
        };

        window.fecharMenuLateral = function() {
            const overlay = document.getElementById("menuOverlay"), drawer = document.getElementById("drawerMenuLateral");
            drawer.classList.add("-translate-x-full"); overlay.classList.add("opacity-0");
            setTimeout(() => overlay.classList.add("hidden"), 300);
        };

        window.abrirModal = function(id) { document.getElementById(id).classList.replace("hidden", "flex"); };
        window.fecharModal = function(id) { document.getElementById(id).classList.replace("flex", "hidden"); };

        window.abrirModalCadastroProduto = function() {
            document.getElementById("pIdKey").value = ""; document.getElementById("formCadastroProduto").reset();
            window.abrirModal('modalCadastroProduto');
        };

        window.abrirEditarProduto = function(id) {
            const prod = todosProdutos.find(p => p.id === id);
            if (!prod) return;
            document.getElementById("pIdKey").value = prod.id; document.getElementById("pNome").value = prod.nome;
            document.getElementById("pGemco").value = prod.gemco; document.getElementById("pReferencia").value = prod.referencia || "";
            document.getElementById("pBarras").value = prod.codigoBarras || "";
            window.abrirModal('modalCadastroProduto');
        };

        window.salvarProduto = function() {
            const idKey = document.getElementById("pIdKey").value;
            const nProd = {
                nome: document.getElementById("pNome").value, gemco: document.getElementById("pGemco").value,
                referencia: document.getElementById("pReferencia").value || "Sem Referência", codigoBarras: document.getElementById("pBarras").value || ""
            };
            const promessa = idKey ? db.ref('catalogo_etiquetas/' + idKey).update(nProd) : db.ref('catalogo_etiquetas').push(nProd);
            promessa.then(() => { window.fecharModal('modalCadastroProduto'); carregarBancoDadosCompleto(); }).catch(err => alert("Erro: " + err.message));
        };

        function carregarBancoDadosCompleto() {
            document.getElementById("contadorItens").innerText = "Sincronizando...";
            db.ref('catalogo_etiquetas').once('value').then((snapshot) => {
                todosProdutos = [];
                if (snapshot.exists()) { snapshot.forEach((child) => { let item = child.val(); item.id = child.key; todosProdutos.push(item); }); }
                window.filtrarProdutos();
            }).catch(() => document.getElementById("contadorItens").innerText = "Erro ao carregar");
        }

        window.limparBancoDeDadosCompletoAdmin = function() {
            if (confirm("🚨 ATENÇÃO: Limpar todo o catálogo?")) db.ref('catalogo_etiquetas').remove().then(() => carregarBancoDadosCompleto());
        };

        window.salvarNovoUsuario = function() {
            const email = document.getElementById("uEmail").value, pass = document.getElementById("uSenha").value, username = document.getElementById("uUsername").value.trim().toLowerCase();
            const meta = { username: username, email: email, perfil: document.getElementById("uPerfil").value };
            auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                db.ref('usuarios_sistema/' + cred.user.uid).set(meta).then(() => { alert("Usuário criado!"); window.fecharModal('modalCadastroUsuario'); });
            }).catch(err => alert(err.message));
        };

        window.processarPlanilha = function(evento) {
            const arquivo = evento.target.files[0]; if (!arquivo) return;
            const leitor = new FileReader();
            leitor.onload = function(e) {
                const planilha = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const primeiraAba = planilha.Sheets[planilha.SheetNames[0]];
                const alcance = XLSX.utils.decode_range(primeiraAba['!ref']);
                for (let i = 2; i <= alcance.e.r + 1; i++) {
                    const gemco = primeiraAba["B"+i], ean = primeiraAba["C"+i], nome = primeiraAba["D"+i], refVal = primeiraAba["E"+i];
                    if (gemco && gemco.v) {
                        db.ref('catalogo_etiquetas').push({
                            gemco: String(gemco.v).trim(), codigoBarras: ean ? String(ean.v).trim() : "",
                            nome: nome ? String(nome.v).trim() : "Sem Descrição", referencia: refVal ? String(refVal.v).trim() : "Sem Referência"
                        });
                    }
                }
                alert("Importação concluída."); carregarBancoDadosCompleto();
            };
            leitor.readAsArrayBuffer(arquivo);
        };

        function renderizarListaProdutos(lista) {
            const ul = document.getElementById("listaProdutos"); ul.innerHTML = "";
            document.getElementById("contadorItens").innerText = todosProdutos.length + " cadastrados";
            lista.slice(0, 50).forEach(prod => {
                const totalQtd = carrinhoSelecionados[prod.gemco] || 0, sel = totalQtd > 0;
                const li = document.createElement("li");
                li.className = sel ? "p-4 flex justify-between items-center cursor-pointer transition bg-green-950/80 border-l-4 border-green-500 text-white" : "p-4 flex justify-between items-center cursor-pointer transition hover:bg-gray-700/50";
                li.onclick = () => window.alternarSelecaoItem(prod.gemco, 1);
                li.ondblclick = (e) => { e.stopPropagation(); dispararPopupQuantidade(prod); };
                
                let botoes = '';
                if(dadosUsuarioLogado.perfil === 'administrador') {
                    botoes = "<button onclick=\"event.stopPropagation(); window.abrirEditarProduto('"+prod.id+"')\" class='text-gray-400 p-1 ml-1'><i class='fas fa-edit'></i></button><button onclick=\"event.stopPropagation(); window.excluirProdutoDireto('"+prod.id+"')\" class='text-red-400 p-1 ml-1'><i class='fas fa-trash'></i></button>";
                }

                li.innerHTML = "<div class='flex-1 pr-4'><div class='font-bold truncate'>" + prod.nome.toUpperCase() + "</div><div class='text-xs mt-1 text-gray-400'>GEMCO: " + prod.gemco + " | EAN: " + (prod.codigoBarras||'N/A') + " | REF: " + (prod.referencia||'N/A') + "</div></div>" +
                "<div class='flex items-center gap-3'>" + (sel ? "<span class='bg-green-700 px-2 rounded text-xs'>🔖 " + totalQtd + "x</span>" : "") + "<input type='checkbox' " + (sel ? "checked" : "") + " onclick=\"event.stopPropagation(); window.alternarSelecaoItemManual('" + prod.gemco + "', this.checked)\">" + botoes + "</div>";
                ul.appendChild(li);
            });
            atualizarPainelLateralSelecionados();
        }

        window.excluirProdutoDireto = function(id) { if (confirm("Excluir item?")) db.ref('catalogo_etiquetas/' + id).remove().then(() => carregarBancoDadosCompleto()); };
        window.alternarSelecaoItem = function(g, qtd) { if (carrinhoSelecionados[g]) { delete carrinhoSelecionados[g]; ordemSelecao = ordemSelecao.filter(i => i !== g); } else { carrinhoSelecionados[g] = qtd; ordemSelecao.unshift(g); } window.filtrarProdutos(); };
        window.alternarSelecaoItemManual = function(g, chk) { if (chk) { carrinhoSelecionados[g] = 1; if(!ordemSelecao.includes(g)) ordemSelecao.unshift(g); } else { delete carrinhoSelecionados[g]; ordemSelecao = ordemSelecao.filter(i => i !== g); } window.filtrarProdutos(); };
        window.removerItemPainel = function(g) { delete carrinhoSelecionados[g]; ordemSelecao = ordemSelecao.filter(i => i !== g); window.filtrarProdutos(); };

        function dispararPopupQuantidade(prod) { produtoAlvoQuantidade = prod; document.getElementById("lblProdutoQtd").innerText = prod.nome; document.getElementById("inputQtdValor").value = carrinhoSelecionados[prod.gemco] || 1; window.abrirModal('modalQuantidade'); setTimeout(() => document.getElementById("inputQtdValor").select(), 50); }
        window.confirmarQuantidade = function() {
            const v = parseInt(document.getElementById("inputQtdValor").value) || 0;
            if (v > 0 && produtoAlvoQuantidade) { if (!carrinhoSelecionados[produtoAlvoQuantidade.gemco]) ordemSelecao.unshift(produtoAlvoQuantidade.gemco); carrinhoSelecionados[produtoAlvoQuantidade.gemco] = v; }
            else if (produtoAlvoQuantidade) { delete carrinhoSelecionados[produtoAlvoQuantidade.gemco]; ordemSelecao = ordemSelecao.filter(i => i !== produtoAlvoQuantidade.gemco); }
            window.fecharModal('modalQuantidade'); window.filtrarProdutos();
        };

        window.limparSelecoesComConfirmacao = function() { if (confirm("Desmarcar tudo?")) { carrinhoSelecionados = {}; ordemSelecao = []; window.filtrarProdutos(); } };

        window.filtrarProdutos = function() {
            const termo = document.getElementById("inputBusca").value.toLowerCase();
            if (!termo) { document.getElementById("lblTituloCatalogo").innerText = "Catálogo"; return renderizarListaProdutos(todosProdutos); }
            const f = todosProdutos.filter(p => p.nome.toLowerCase().includes(termo) || p.gemco.toLowerCase().includes(termo) || (p.codigoBarras && p.codigoBarras.includes(termo)));
            document.getElementById("lblTituloCatalogo").innerText = "Resultados: " + f.length; renderizarListaProdutos(f);
        };

        function atualizarPainelLateralSelecionados() {
            const container = document.getElementById("listaSelecionadosPainel"); container.innerHTML = "";
            let t = 0; Object.values(carrinhoSelecionados).forEach(v => t += v); document.getElementById("txtTotalSelecionadoRodape").innerText = t;
            if (ordemSelecao.length === 0) return container.innerHTML = '<div class="text-center text-gray-500 py-8">Nenhuma etiqueta.</div>';
            ordemSelecao.forEach(g => {
                const qtd = carrinhoSelecionados[g], prod = todosProdutos.find(p => p.gemco === g); if (!prod) return;
                const div = document.createElement("div"); div.className = "bg-green-950 p-3 rounded-lg flex flex-col gap-1 text-xs cursor-pointer";
                div.ondblclick = () => dispararPopupQuantidade(prod);
                div.innerHTML = "<div class='flex justify-between'><b>" + prod.nome.substring(0, 20) + "</b><button onclick=\"event.stopPropagation(); window.removerItemPainel('" + g + "')\" class='text-red-400'><i class='fas fa-trash'></i></button></div><div class='text-green-200 mt-1'>🔖 " + qtd + "x</div>";
                container.appendChild(div);
            });
        }

        window.gerarPDFEtiquetas = function() { alert("Para habilitar a impressão em PDF, a biblioteca jsPDF será acionada."); };
        window.abrirHistorico = function() { alert("Histórico indisponível na pré-visualização simplificada."); };
    </script>
</body>
</html>
